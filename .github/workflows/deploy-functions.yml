# Deploys the Supabase edge functions whenever they change on main.
# Needs two GitHub secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  – from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – zmkgmebzeagtdxhdiyuo
# It does NOT touch the database: SQL migrations are run by hand (see README).
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      # Bundles each function on the runner (Docker) and uploads it; one at a time so an error names the function.
      - run: |
          set -e
          for f in read-card send-email track odoo-sync reminders; do
            echo "::group::Deploying $f"
            supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF" --debug
            echo "::endgroup::"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
